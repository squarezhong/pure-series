name: Sync Pure Series

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    paths-ignore:
      - 'pure-series.user.js'
      - 'pure-series.meta.js'
      - 'sources.json'
      - 'build-state.json'
      - 'README.md'
  pull_request:

permissions:
  contents: read

concurrency:
  group: pure-series-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  sync:
    needs: test
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run check
      - name: Commit generated files when changed
        run: |
          git add pure-series.user.js pure-series.meta.js sources.json build-state.json README.md
          if git diff --cached --quiet; then
            echo "Pure Series is already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync Pure userscripts'
          git push
